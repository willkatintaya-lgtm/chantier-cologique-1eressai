<title>Carte des chantiers écologiques</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Mise en page : bandeau d'outils collant ; à gauche les ancêtres en tranches verticales étroites ;
   au centre la boîte courante, ses filles en cartes et ses petites-filles en lignes ; mini-carte flottante. */
:root{
  --fond:#f3f5f4; --surface:#ffffff; --creux:#e9edeb; --encre:#15201d; --doux:#586661; --trait:#d9e0dd;
  --loger:#1d5f8a; --loger-pale:#dce9f2; --conso:#8a4a1d; --conso-pale:#f3e6da; --racine:#3d4a46;
  --d-A:#2b6cb0; --d-D:#b7791f; --d-B:#2f855a; --d-R:#6b46c1; --d-P:#c53030;
  --surbrillance:#ffe9a8; --ombre:0 1px 2px rgba(21,32,29,.06),0 4px 14px rgba(21,32,29,.05);
  --titre:"Source Serif 4",Georgia,"Times New Roman",serif;
  --texte:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --h-bandeau:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fond:#111715; --surface:#1a2220; --creux:#222c29; --encre:#e8eeeb; --doux:#9aa8a3; --trait:#2e3a36;
  --loger:#7fb8e0; --loger-pale:#1b3344; --conso:#e0a77f; --conso-pale:#40301f; --racine:#b5c2bd;
  --d-A:#74a9e6; --d-D:#e0b060; --d-B:#6cc394; --d-R:#a990ea; --d-P:#f08080;
  --surbrillance:#5c4a12; --ombre:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --fond:#111715; --surface:#1a2220; --creux:#222c29; --encre:#e8eeeb; --doux:#9aa8a3; --trait:#2e3a36;
  --loger:#7fb8e0; --loger-pale:#1b3344; --conso:#e0a77f; --conso-pale:#40301f; --racine:#b5c2bd;
  --d-A:#74a9e6; --d-D:#e0b060; --d-B:#6cc394; --d-R:#a990ea; --d-P:#f08080;
  --surbrillance:#5c4a12; --ombre:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--fond);color:var(--encre);font:400 15px/1.5 var(--texte);margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--teinte,var(--loger));outline-offset:2px;border-radius:4px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}

/* Bandeau */
.bandeau{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--trait);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.marque{font:600 17px/1.2 var(--titre);margin:0;white-space:nowrap}
.recherche{position:relative;flex:1 1 240px;min-width:0;max-width:520px}
.recherche input{width:100%;font:inherit;color:inherit;background:var(--creux);border:1px solid transparent;border-radius:8px;padding:8px 12px}
.recherche input:focus{outline:none;border-color:var(--loger);background:var(--surface)}
.resultats{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--trait);border-radius:10px;
  box-shadow:var(--ombre);max-height:min(70vh,560px);overflow:auto;padding:6px}
.resultats .info{color:var(--doux);font-size:13px;padding:6px 10px}
.res{display:block;width:100%;padding:8px 10px;border-radius:7px}
.res:hover,.res.actif{background:var(--creux)}
.res .lib{font:600 15px/1.35 var(--titre)}
.res .chemin{color:var(--doux);font-size:12.5px;margin-top:2px}
mark{background:var(--surbrillance);color:inherit;border-radius:2px;padding:0 1px}
.filtres{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filtres .intitule{color:var(--doux);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-right:2px}
.puce{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--trait);border-radius:999px;padding:4px 10px 4px 8px;font-size:13px;background:var(--surface)}
.puce i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.puce[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.puce[aria-pressed="true"] i{background:var(--surface)}

/* Corps */
.corps{display:flex;align-items:stretch;min-height:calc(100dvh - var(--h-bandeau))}
.tranches{display:flex;flex:none;position:sticky;top:calc(var(--h-bandeau) + env(safe-area-inset-top,0px));align-self:flex-start;
  height:calc(100dvh - var(--h-bandeau) - env(safe-area-inset-top,0px));padding-left:env(safe-area-inset-left,0px)}
.tranche{width:46px;border-right:1px solid var(--trait);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;overflow:hidden}
.tranche:hover{background:var(--creux)}
.tranche .niv{font:600 12px/1 var(--texte);color:var(--surface);background:var(--teinte);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;flex:none}
.tranche .lib{writing-mode:vertical-rl;transform:rotate(180deg);font:600 14px/1.2 var(--titre);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:0;flex:1;color:var(--encre)}
.vue{flex:1;min-width:0;padding-block:28px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vue>*{max-width:1320px;margin-inline:auto}
@media (min-width:900px){.vue{padding-left:36px;padding-right:36px}}

/* Boîte courante */
.courante{margin-bottom:26px}
.etiquette{display:inline-flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--teinte);font-weight:600}
.etiquette .nat{color:var(--doux);font-weight:500}
.courante h1{font:600 clamp(26px,3.4vw,40px)/1.15 var(--titre);margin:8px 0 10px;text-wrap:balance;max-width:26em}
.courante .def{font-size:17px;line-height:1.55;max-width:44em;margin:0 0 14px}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--doux);font-size:14px;align-items:baseline}
.meta b{color:var(--encre);font-weight:600;font-variant-numeric:tabular-nums}
.defis{display:inline-flex;flex-wrap:wrap;gap:4px 10px}
.defi{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--doux);white-space:nowrap}
.defi i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.partage{margin:16px 0 0;padding:10px 14px;background:var(--creux);border-radius:8px;font-size:14px;max-width:60em}
.partage span{color:var(--doux);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-right:8px}
.renvois{margin-top:10px;font-size:14px;color:var(--doux)}
.lien{color:var(--teinte);text-decoration:underline;text-underline-offset:3px}
.remonter{display:none;margin-bottom:14px;color:var(--teinte);font-weight:500}

/* Cartes */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px;align-items:start}
.grille.large{grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.carte{background:var(--surface);border:1px solid var(--trait);border-radius:10px;box-shadow:var(--ombre);min-width:0}
.carte.pale{opacity:.38}
.carte .tete{display:block;width:100%;padding:16px 18px 14px;border-radius:10px 10px 0 0}
.carte .tete:hover h2{text-decoration:underline;text-decoration-color:var(--teinte);text-underline-offset:4px}
.carte .rang{font-size:12px;color:var(--doux);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.carte h2{font:600 19px/1.28 var(--titre);margin:0 0 6px;text-wrap:balance}
.carte .def{margin:0 0 10px;color:var(--doux);font-size:14.5px;line-height:1.5}
.carte .pied{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.compte{font-size:13px;color:var(--doux);font-variant-numeric:tabular-nums}
.compte b{color:var(--encre);font-weight:600}
.filles{list-style:none;margin:0;padding:6px 8px 8px;border-top:1px solid var(--trait)}
.fille{display:flex;width:100%;gap:10px;align-items:baseline;justify-content:space-between;padding:7px 10px;border-radius:6px;font-size:14.5px;line-height:1.4}
.fille:hover{background:var(--creux)}
.fille.pale{opacity:.38}
.fille .n{flex:none;color:var(--doux);font-size:12.5px;font-variant-numeric:tabular-nums}
.vide{color:var(--doux);padding:30px 0}

/* Mini-carte */
.minicarte{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--surface);
  border:1px solid var(--trait);border-radius:10px;box-shadow:var(--ombre);padding:8px 10px 8px;width:min(340px,calc(100vw - 28px))}
.minicarte header{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--doux)}
.minicarte canvas{display:block;width:100%;height:112px;margin-top:6px;cursor:pointer;border-radius:4px}
.minicarte .legende{font-size:12.5px;color:var(--doux);margin-top:5px;min-height:2.7em;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.minicarte.repliee canvas,.minicarte.repliee .legende{display:none}
.minicarte.repliee{width:auto}
.minicarte button{color:var(--doux);font-size:12px;padding:2px 4px}

@media (max-width:720px){
  :root{--h-bandeau:150px}
  .bandeau{position:static}
  .tranches{display:none}
  .remonter{display:inline-block}
  .vue{padding-block:18px 150px}
  .courante .def{font-size:16px}
}
@media (prefers-reduced-motion:no-preference){.carte,.fille,.res,.tranche{transition:background-color .12s,opacity .15s}}
</style>

<div class="bandeau" id="bandeau">
  <p class="marque">Carte des chantiers écologiques</p>
  <div class="recherche">
    <input id="champ-recherche" type="search" placeholder="Chercher un chantier, un verrou, un problème…" autocomplete="off" aria-label="Chercher dans la carte">
    <div class="resultats" id="resultats" hidden></div>
  </div>
  <div class="filtres" id="filtres" role="group" aria-label="Filtrer par défi"><span class="intitule">Défis</span></div>
</div>
<div class="corps">
  <nav class="tranches" id="tranches" aria-label="Niveaux supérieurs"></nav>
  <main class="vue" id="vue"><p class="vide">Chargement de la carte…</p></main>
</div>
<aside class="minicarte" id="minicarte" aria-label="Mini-carte de repérage">
  <header><span>Repérage</span><button id="replier" type="button" aria-expanded="true">Masquer</button></header>
  <canvas id="toile" height="112"></canvas>
  <div class="legende" id="legende"></div>
</aside>
<script id="donnees" type="application/json"></script>
<script>
(function(){
"use strict";
var DEFIS=[["atténuation","A","Atténuation"],["adaptation","D","Adaptation"],["biodiversité","B","Biodiversité"],["ressources","R","Ressources"],["pollutions et santé","P","Pollutions et santé"]];
var CODE={},NOMDEFI={};DEFIS.forEach(function(d){CODE[d[0]]=d[1];NOMDEFI[d[1]]=d[2];});
var NIVEAUX=["","Racine","Thématique","Grand chantier","Levier","Chantier","Verrou","Verrou précis","Problème"];
var PLURIEL=["","","thématiques","grands chantiers","leviers","chantiers","verrous","verrous précis","problèmes"];
var NATURES={technique:"technique","économique":"économique","réglementaire":"réglementaire",organisationnelle:"organisationnel",comportementale:"comportemental"};
var N=[],PAR={},RACINE=null,ACTIFS={},nbActifs=0,COURANT=null,PROF=1;
var $=function(i){return document.getElementById(i);};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function norm(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function fr(n){return n.toLocaleString("fr-FR");}
function ancre(id){return "n-"+id.replace(/\./g,"-");}
function teinte(n){var m=n;while(m.p&&m.niveau>2)m=m.p;return m.niveau<2?"var(--racine)":(m.id==="1.2"?"var(--conso)":"var(--loger)");}

function charger(){
  var brut=$("donnees").textContent.trim();
  if(brut.length>20&&brut.charAt(0)==="[")return Promise.resolve(JSON.parse(brut));
  return fetch("taxonomie.json").then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});
}
function indexer(liste){
  N=liste;
  N.forEach(function(n){n.e=[];n.c=(n.defis||[]).map(function(d){return CODE[d];});PAR[n.id]=n;});
  N.forEach(function(n){n.p=n.parent?PAR[n.parent]:null;if(n.p)n.p.e.push(n);else RACINE=n;if(n.niveau>PROF)PROF=n.niveau;});
  var x=0;
  (function passe(n){n.x0=x;n.nb=0;n.nb8=0;
    if(!n.e.length){x++;}
    n.e.forEach(function(f){passe(f);n.nb+=f.nb+1;n.nb8+=f.nb8+(f.niveau===8?1:0);});
    n.nf=x-n.x0;})(RACINE);
  filtrer();
}
function correspond(n){if(!nbActifs)return true;for(var i=0;i<n.c.length;i++)if(ACTIFS[n.c[i]])return true;return false;}
function filtrer(){(function passe(n){n.ok=correspond(n);n.nbF=0;n.e.forEach(function(f){passe(f);n.nbF+=f.nbF+(f.ok?1:0);});})(RACINE);}

/* Rendu */
function defisHtml(n){return '<span class="defis">'+n.c.map(function(c){return '<span class="defi" style="--c:var(--d-'+c+')"><i></i>'+NOMDEFI[c]+'</span>';}).join("")+'</span>';}
function compteHtml(n){
  if(!n.e.length)return "";
  var t=nbActifs?'<b>'+fr(n.nbF)+'</b> sur '+fr(n.nb)+(n.nb>1?' boîtes':' boîte')+' en dessous':'<b>'+fr(n.nb)+'</b> '+(n.nb>1?'boîtes':'boîte')+' en dessous';
  if(n.nb8&&n.niveau<7)t+=' · '+fr(n.nb8)+' problèmes';
  return '<span class="compte">'+t+'</span>';
}
function rendre(){
  var n=COURANT,h="",anc=[],m=n.p;while(m){anc.unshift(m);m=m.p;}
  $("tranches").innerHTML=anc.map(function(a){return '<button class="tranche" type="button" data-id="'+a.id+'" style="--teinte:'+teinte(a)+'" title="'+esc(NIVEAUX[a.niveau]+" : "+a.libelle)+'"><span class="niv">'+a.niveau+'</span><span class="lib">'+esc(a.libelle)+'</span></button>';}).join("");
  h+='<section class="courante" style="--teinte:'+teinte(n)+'">';
  if(n.p)h+='<button class="remonter lien" type="button" data-id="'+n.p.id+'">← '+esc(n.p.libelle)+'</button><br>';
  h+='<span class="etiquette">Niveau '+n.niveau+' · '+NIVEAUX[n.niveau]+(n.nature?' <span class="nat">· verrou '+esc(NATURES[n.nature]||n.nature)+'</span>':'')+'</span>';
  h+='<h1>'+esc(n.libelle)+'</h1><p class="def">'+esc(n.definition)+'</p>';
  h+='<div class="meta">'+defisHtml(n)+compteHtml(n)+(n.e.length?'<span><b>'+n.e.length+'</b> '+PLURIEL[n.niveau+1]+'</span>':'')+'<span>'+esc(n.id)+'</span></div>';
  if(n.critere&&n.e.length)h+='<p class="partage"><span>Découpage</span>'+esc(n.critere)+'</p>';
  if(n.renvois&&n.renvois.length)h+='<p class="renvois">Voir aussi : '+n.renvois.filter(function(r){return PAR[r];}).map(function(r){return '<button class="lien" type="button" data-id="'+r+'">'+esc(PAR[r].libelle)+'</button>';}).join(" · ")+'</p>';
  h+='</section>';
  if(n.e.length){
    var feuilles=n.e.every(function(f){return !f.e.length;});
    h+='<section class="grille'+(feuilles?' large':'')+'" style="--teinte:'+teinte(n)+'">'+n.e.map(function(f,i){
      var pale=nbActifs&&!f.ok&&!f.nbF;
      var c='<article class="carte'+(pale?' pale':'')+'"><button class="tete" type="button" data-id="'+f.id+'"><div class="rang"><span>'+NIVEAUX[f.niveau]+' '+(i+1)+(f.nature?' · '+esc(NATURES[f.nature]||f.nature):'')+'</span></div><h2>'+esc(f.libelle)+'</h2><p class="def">'+esc(f.definition)+'</p><div class="pied">'+defisHtml(f)+compteHtml(f)+'</div></button>';
      if(f.e.length)c+='<ul class="filles">'+f.e.map(function(g){var p=nbActifs&&!g.ok&&!g.nbF;return '<li><button class="fille'+(p?' pale':'')+'" type="button" data-id="'+g.id+'"><span>'+esc(g.libelle)+'</span>'+(g.e.length?'<span class="n">'+fr(nbActifs?g.nbF:g.nb)+'</span>':'')+'</button></li>';}).join("")+'</ul>';
      return c+'</article>';}).join("")+'</section>';
  }else if(n.niveau<8){h+='<p class="vide">Cette boîte n’est pas encore détaillée.</p>';}
  $("vue").innerHTML=h;
  dessiner();
}
function aller(id,sansHistorique){
  var n=PAR[id];if(!n)return;COURANT=n;
  if(!sansHistorique){try{if(location.hash!=="#"+ancre(id))history.pushState(null,"","#"+ancre(id));}catch(e){location.hash=ancre(id);}}
  rendre();window.scrollTo(0,0);
}
function depuisAncre(){var h=location.hash.replace(/^#n-/,"").replace(/-/g,".");aller(PAR[h]?h:RACINE.id,true);}

/* Mini-carte */
var toile=$("toile"),ctx=toile.getContext("2d"),fondCache=null,L=0,H=112,RANG=14;
function couleur(nom){return getComputedStyle(document.documentElement).getPropertyValue(nom).trim();}
function dessinerFond(){
  var r=window.devicePixelRatio||1;L=toile.clientWidth||320;toile.width=L*r;toile.height=H*r;
  fondCache=document.createElement("canvas");fondCache.width=toile.width;fondCache.height=toile.height;
  var c=fondCache.getContext("2d");c.scale(r,r);
  var tot=RACINE.nf,cl={l:couleur("--loger"),c:couleur("--conso"),r:couleur("--racine"),f:couleur("--surface")};
  c.fillStyle=couleur("--creux");c.fillRect(0,0,L,H);
  N.forEach(function(n){
    var x=n.x0/tot*L,w=n.nf/tot*L,y=(n.niveau-1)*RANG;
    var t=n.niveau<2?cl.r:(n.id.indexOf("1.2")===0?cl.c:cl.l);
    var rang=n.p?n.p.e.indexOf(n):0;
    c.globalAlpha=(nbActifs&&!n.ok?0.12:(0.45+0.4*((rang+n.niveau)%2)));
    c.fillStyle=t;c.fillRect(x,y,Math.max(w-(w>3?0.6:0),0.35),RANG-1.5);
  });
  c.globalAlpha=1;
}
function dessiner(){
  if(!RACINE||$("minicarte").classList.contains("repliee"))return;
  if(!fondCache||toile.clientWidth!==L)dessinerFond();
  var r=window.devicePixelRatio||1;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,toile.width,toile.height);ctx.drawImage(fondCache,0,0);ctx.setTransform(r,0,0,r,0,0);
  var tot=RACINE.nf,n=COURANT,enc=couleur("--encre");
  var x=n.x0/tot*L,w=Math.max(n.nf/tot*L,2);
  ctx.fillStyle=enc;ctx.globalAlpha=0.16;ctx.fillRect(x,(n.niveau-1)*RANG,w,H-(n.niveau-1)*RANG);ctx.globalAlpha=1;
  ctx.strokeStyle=enc;ctx.lineWidth=1.5;
  var m=n;while(m){var mx=m.x0/tot*L,mw=Math.max(m.nf/tot*L,2);ctx.strokeRect(mx+0.75,(m.niveau-1)*RANG+0.25,Math.max(mw-1.5,1),RANG-2);m=m.p;}
  ctx.beginPath();ctx.moveTo(x+w/2-4,H);ctx.lineTo(x+w/2+4,H);ctx.lineTo(x+w/2,H-6);ctx.fill();
  $("legende").textContent=NIVEAUX[n.niveau]+" · "+n.libelle;
}
function sousPointeur(ev){
  var b=toile.getBoundingClientRect(),fx=(ev.clientX-b.left)/b.width*RACINE.nf,niv=Math.min(PROF,Math.floor((ev.clientY-b.top)/RANG)+1),n=RACINE;
  while(n.niveau<niv&&n.e.length){var s=null;for(var i=0;i<n.e.length;i++){var f=n.e[i];if(fx>=f.x0&&fx<f.x0+f.nf){s=f;break;}}if(!s)break;n=s;}
  return n;
}
toile.addEventListener("mousemove",function(ev){var n=sousPointeur(ev);$("legende").textContent=NIVEAUX[n.niveau]+" · "+n.libelle;});
toile.addEventListener("mouseleave",function(){if(COURANT)$("legende").textContent=NIVEAUX[COURANT.niveau]+" · "+COURANT.libelle;});
toile.addEventListener("click",function(ev){aller(sousPointeur(ev).id);});
$("replier").addEventListener("click",function(){var r=$("minicarte").classList.toggle("repliee");this.textContent=r?"Afficher la mini-carte":"Masquer";this.setAttribute("aria-expanded",String(!r));if(!r)dessiner();});

/* Recherche */
var pret=false,minuteur=null,selection=-1;
function preparer(){if(pret)return;N.forEach(function(n){n.rl=norm(n.libelle);n.rd=norm(n.definition||"");});pret=true;}
function surligner(texte,q){var t=norm(texte),i=t.indexOf(q);if(i<0||t.length!==texte.length)return esc(texte);return esc(texte.slice(0,i))+"<mark>"+esc(texte.slice(i,i+q.length))+"</mark>"+esc(texte.slice(i+q.length));}
function chercher(){
  var q=norm($("champ-recherche").value.trim()),bo=$("resultats");selection=-1;
  if(q.length<2){bo.hidden=true;return;}
  preparer();
  var mots=q.split(/\s+/),a=[],b=[];
  for(var i=0;i<N.length;i++){var n=N[i];if(nbActifs&&!n.ok)continue;
    var dansL=true,dansT=true;
    for(var j=0;j<mots.length;j++){var dl=n.rl.indexOf(mots[j])>=0;if(!dl)dansL=false;if(!dl&&n.rd.indexOf(mots[j])<0){dansT=false;break;}}
    if(dansL)a.push(n);else if(dansT)b.push(n);}
  var tout=a.concat(b),h='<div class="info">'+(tout.length?fr(tout.length)+(tout.length>1?" boîtes trouvées":" boîte trouvée")+(tout.length>60?", les 60 premières affichées":""):"Aucune boîte ne contient ces mots. Essayez un mot plus court.")+'</div>';
  tout.slice(0,60).forEach(function(n){var ch=[],m=n.p;while(m&&m.niveau>1){ch.unshift(m.libelle);m=m.p;}
    h+='<button class="res" type="button" data-id="'+n.id+'"><div class="lib">'+surligner(n.libelle,mots[0])+'</div><div class="chemin">'+NIVEAUX[n.niveau]+(ch.length?" · "+esc(ch.slice(-3).join(" › ")):"")+'</div></button>';});
  bo.innerHTML=h;bo.hidden=false;
}
$("champ-recherche").addEventListener("input",function(){clearTimeout(minuteur);minuteur=setTimeout(chercher,110);});
$("champ-recherche").addEventListener("focus",function(){if(this.value.trim().length>1)chercher();});
$("champ-recherche").addEventListener("keydown",function(ev){
  var r=$("resultats").querySelectorAll(".res");
  if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){ev.preventDefault();if(!r.length)return;selection=(selection+(ev.key==="ArrowDown"?1:-1)+r.length)%r.length;r.forEach(function(e,i){e.classList.toggle("actif",i===selection);});r[selection].scrollIntoView({block:"nearest"});}
  else if(ev.key==="Enter"){var c=r[selection<0?0:selection];if(c){aller(c.dataset.id);$("resultats").hidden=true;this.blur();}}
  else if(ev.key==="Escape"){$("resultats").hidden=true;this.blur();}
});
document.addEventListener("click",function(ev){
  var c=ev.target.closest("[data-id]");
  if(c){aller(c.dataset.id);$("resultats").hidden=true;return;}
  if(!ev.target.closest(".recherche"))$("resultats").hidden=true;
});
document.addEventListener("keydown",function(ev){
  if(ev.target.tagName==="INPUT")return;
  if(ev.key==="/"){ev.preventDefault();$("champ-recherche").focus();}
  else if((ev.key==="Escape"||ev.key==="Backspace")&&COURANT&&COURANT.p){ev.preventDefault();aller(COURANT.p.id);}
});

/* Filtres */
DEFIS.forEach(function(d){
  var b=document.createElement("button");b.type="button";b.className="puce";b.id="filtre-"+d[1];b.style.setProperty("--c","var(--d-"+d[1]+")");b.setAttribute("aria-pressed","false");
  b.innerHTML="<i></i>"+d[2];
  b.addEventListener("click",function(){ACTIFS[d[1]]=!ACTIFS[d[1]];nbActifs=Object.keys(ACTIFS).filter(function(k){return ACTIFS[k];}).length;b.setAttribute("aria-pressed",String(!!ACTIFS[d[1]]));filtrer();fondCache=null;rendre();if(!$("resultats").hidden)chercher();});
  $("filtres").appendChild(b);
});

function mesurer(){var h=$("bandeau").offsetHeight;document.documentElement.style.setProperty("--h-bandeau",h+"px");}
window.addEventListener("resize",function(){mesurer();fondCache=null;dessiner();});
window.addEventListener("hashchange",depuisAncre);window.addEventListener("popstate",depuisAncre);
if(window.matchMedia){var mq=window.matchMedia("(prefers-color-scheme: dark)");if(mq.addEventListener)mq.addEventListener("change",function(){fondCache=null;dessiner();});}
if(window.innerWidth<720){$("minicarte").classList.add("repliee");$("replier").textContent="Afficher la mini-carte";$("replier").setAttribute("aria-expanded","false");}
charger().then(function(l){indexer(l);mesurer();depuisAncre();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(mesurer);})
  .catch(function(){$("vue").innerHTML='<p class="vide">Les données n’ont pas pu être lues. Placez taxonomie.json à côté de cette page, ou ouvrez la page depuis un serveur web.</p>';});
})();
</script>
